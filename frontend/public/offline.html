<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1f3a">
<title>Acceptify AI</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #071326; color: #f5f7fb; padding: 16px; box-sizing: border-box;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
  }
  main { max-width: 360px; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 20px; margin: 20px 0 8px; }
  p { color: #9fb0c8; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
  button {
    font: inherit; font-weight: 600; font-size: 15px; color: #fff; background: #2f6feb;
    border: 0; border-radius: 10px; padding: 12px 24px; cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1 id="title">Нет подключения к интернету</h1>
  <p id="text">Acceptify AI работает онлайн. Проверь соединение и попробуй ещё раз.</p>
  <button id="retry" type="button" onclick="location.reload()">Повторить</button>
</main>
<script>
  if (/(?:^|;\s*)acceptify-locale=en/.test(document.cookie)) {
    document.documentElement.lang = "en";
    document.getElementById("title").textContent = "No internet connection";
    document.getElementById("text").textContent = "Acceptify AI works online. Check your connection and try again.";
    document.getElementById("retry").textContent = "Try again";
  }
  addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
