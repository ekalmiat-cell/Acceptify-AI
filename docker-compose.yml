services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: acceptify
      POSTGRES_PASSWORD: acceptify
      POSTGRES_DB: acceptify
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acceptify"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
